kind = "web"
previewPath = "/"
title = "PRIVELUX"
description = "PRIVELUX is a premium ecommerce web application for luxury fashion and accessories. It features a full product catalog with categories, a shopping cart, WhatsApp-based purchase flow, admin dashboard with statistics, and a brand-focused storefront targeting premium lifestyle shoppers."
version = "1.0.0"
id = "artifacts/privelux"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19707

[services.development]
run = "pnpm --filter @workspace/privelux run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/privelux", "run", "build" ]
serve = "static"
publicDir = "artifacts/privelux/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19707"
BASE_PATH = "/"
